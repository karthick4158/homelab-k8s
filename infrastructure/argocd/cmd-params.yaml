# Overrides the empty argocd-cmd-params-cm from install.yaml. Traefik
# terminates TLS, so argocd-server serves plain HTTP (otherwise it redirects
# to HTTPS forever). argocd-server reads this only at startup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
data:
  server.insecure: "true"

# Prometheus scrapes the exporter at /pve?module=default&target=10.0.0.66&cluster=1&node=1.
# The exporter README's scrape config uses static targets and relabels __address__ into
# __param_target; with a ServiceMonitor the address is the exporter itself, so target is set as a
# fixed param here and only the instance label is rewritten to the Proxmox host.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pve-exporter
spec:
  selector:
    matchLabels:
      app: pve-exporter
  endpoints:
    - port: http
      path: /pve
      params:
        module: [default]
        target: [10.0.0.66]
        cluster: ["1"]
        node: ["1"]
      interval: 60s
      scrapeTimeout: 30s
      relabelings:
        - sourceLabels: [__param_target]
          targetLabel: instance

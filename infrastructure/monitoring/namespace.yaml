# Owned here rather than by the chart app, so it can carry the label.
# Delete=false: removing the app must not delete the Prometheus/Grafana volumes.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    gateway-access: "true"  # allows routes here to attach to traefik-gateway
  annotations:
    argocd.argoproj.io/sync-options: Delete=false

# Prometheus scrapes node_exporter on the OpenMediaVault server (bare-metal Debian, 10.0.0.65:9100,
# Debian package prometheus-node-exporter). OMV is outside the cluster, so this is a Prometheus
# Operator ScrapeConfig with a static target. (A selector-less Service + hand-written Endpoints +
# ServiceMonitor was tried first, but Argo CD never synced the Endpoints object.)
# kube-prometheus-stack runs with scrapeConfigSelectorNilUsesHelmValues: false
# (argocd-apps/monitoring.yaml), so this is picked up without a release label.
# jobName sets the job label to omv-node-exporter, so it never mixes with the in-cluster
# node-exporter job (and the OMV dashboard selects on it); instance is fixed to "omv".
# Field names checked against the ScrapeConfig v1alpha1 CRD shipped in kube-prometheus-stack
# 92.21.2 (Prometheus Operator v0.94.2).
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: omv-node-exporter
spec:
  jobName: omv-node-exporter
  scheme: HTTP
  metricsPath: /metrics
  scrapeInterval: 30s
  scrapeTimeout: 10s
  staticConfigs:
    - targets:
        - 10.0.0.65:9100
  relabelings:
    - targetLabel: instance
      replacement: omv

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  - grafana-admin.sops.yaml
  - httproute.yaml
  - pve-exporter.yaml
  - pve-servicemonitor.yaml
  - pve-exporter-token.sops.yaml
  - omv-scrape.yaml

# Grafana dashboards as JSON in Git. The Grafana sidecar loads every ConfigMap labelled
# grafana_dashboard: "1" in this namespace (kube-prometheus-stack default).
configMapGenerator:
  - name: grafana-dashboard-home
    files:
      - dashboards/home.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-proxmox
    files:
      - dashboards/proxmox.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-omv
    files:
      - dashboards/omv.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"

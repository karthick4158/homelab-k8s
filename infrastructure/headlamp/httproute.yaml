apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - headlamp.homelab.lan
  rules:
    - backendRefs:
        - name: headlamp  # Service from the headlamp app's chart
          port: 80

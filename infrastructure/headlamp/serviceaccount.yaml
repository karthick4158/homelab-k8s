# Login account for Headlamp. Bound to the built-in "view" ClusterRole:
# read-only, and view excludes Secrets. Tokens are created on demand
# (docs/cluster-setup.md), never stored here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: headlamp

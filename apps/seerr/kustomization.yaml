apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Also puts the generated gluetun ConfigMaps in this namespace.
namespace: seerr

resources:
  - seerr.yaml
  - gluetun-vpn.sops.yaml

# Gluetun VPN sidecar; see components/gluetun/README.md.
components:
  - ../../components/gluetun

configMapGenerator:
  - name: gluetun-app
    literals:
      # 5055 for Traefik -> Seerr, 9999 for kubelet probes on gluetun.
      - FIREWALL_INPUT_PORTS=5055,9999

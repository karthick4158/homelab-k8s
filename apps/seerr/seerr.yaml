# Seerr media request manager. Reached via traefik-gateway at
# Host: seerr.homelab.lan on http://10.0.0.89/ (and https).
# Runs alongside the existing Seerr VM (106), which is untouched; this
# instance starts with a fresh config for now.
apiVersion: v1
kind: Namespace
metadata:
  name: seerr
  labels:
    gateway-access: "true"  # allows routes here to attach to traefik-gateway
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seerr-config
  namespace: seerr
spec:
  accessModes: [ReadWriteOnce]
  # No storageClassName: uses the default (local-path).
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: seerr
  labels:
    vpn: gluetun  # gets the gluetun sidecar (components/gluetun)
spec:
  replicas: 1
  # RWO volume: old pod must release it before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:v3.5.1
          ports:
            - name: http
              containerPort: 5055
          volumeMounts:
            - name: config
              mountPath: /app/config
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /api/v1/settings/public
              port: http
          # Startup: grace period while booting (up to 5 min); liveness
          # checks only begin once this passes.
          startupProbe:
            httpGet:
              path: /api/v1/settings/public
              port: http
            periodSeconds: 10
            failureThreshold: 30
          # Liveness: restart the container if the app stops answering.
          livenessProbe:
            httpGet:
              path: /api/v1/settings/public
              port: http
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr-config
---
apiVersion: v1
kind: Service
metadata:
  name: seerr
  namespace: seerr
spec:
  selector:
    app: seerr
  ports:
    - name: http
      port: 5055
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr
  namespace: seerr
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - seerr.homelab.lan
  rules:
    - backendRefs:
        - name: seerr
          port: 5055

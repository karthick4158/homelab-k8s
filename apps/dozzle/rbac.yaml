# Read-only cluster access for Dozzle's Kubernetes mode (pod list, logs,
# events and CPU/memory stats). No Secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dozzle
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dozzle-read
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, pods/log, nodes, events]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dozzle-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dozzle-read
subjects:
  - kind: ServiceAccount
    name: dozzle
    namespace: dozzle

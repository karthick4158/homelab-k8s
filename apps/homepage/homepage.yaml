# Homepage dashboard (gethomepage.dev) at home.homelab.lan. All config is in
# config/*.yaml (ConfigMap from kustomization.yaml); API keys and passwords
# come from the homepage-keys Secret as HOMEPAGE_VAR_* env vars and are
# referenced in the YAML as {{HOMEPAGE_VAR_...}}.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  labels:
    app: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage  # rbac.yaml, for the Kubernetes widget
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.8.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: home.homelab.lan
            - name: TZ
              value: America/Chicago
          envFrom:
            - secretRef:
                name: homepage-keys  # homepage-keys.sops.yaml
          # Each config file is mounted read-only over a writable emptyDir, so
          # Homepage can still write its logs and any default files it adds.
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: config-files
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
              readOnly: true
            - name: config-files
              mountPath: /app/config/services.yaml
              subPath: services.yaml
              readOnly: true
            - name: config-files
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
              readOnly: true
            - name: config-files
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
              readOnly: true
            - name: config-files
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
              readOnly: true
            - name: config-files
              mountPath: /app/config/custom.css
              subPath: custom.css
              readOnly: true
            - name: config-files
              mountPath: /app/public/images/bg.jpg
              subPath: bg.jpg
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
              # Homepage rejects Hosts not in HOMEPAGE_ALLOWED_HOSTS; the
              # kubelet would otherwise send the pod IP.
              httpHeaders:
                - name: Host
                  value: home.homelab.lan
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
              # Homepage rejects Hosts not in HOMEPAGE_ALLOWED_HOSTS; the
              # kubelet would otherwise send the pod IP.
              httpHeaders:
                - name: Host
                  value: home.homelab.lan
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          emptyDir: {}
        - name: config-files
          configMap:
            name: homepage-config
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
spec:
  selector:
    app: homepage
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - home.homelab.lan
  rules:
    - backendRefs:
        - name: homepage
          port: 3000

# https://gethomepage.dev/configs/settings/
title: Homelab
theme: dark
color: slate
headerStyle: clean
statusStyle: dot
useEqualHeights: true
cardBlur: md
background:
  image: "https://images.unsplash.com/photo-1502790671504-542ad42d5189?auto=format&fit=crop&w=2560&q=80"
  blur: sm
  saturate: 50
  brightness: 50
  opacity: 100
hideVersion: true
target: _blank

layout:
  Media:
    style: row
    columns: 3
    icon: mdi-play-circle
  Downloads:
    style: row
    columns: 3
    icon: mdi-download
  Infrastructure:
    style: row
    columns: 3
    icon: mdi-kubernetes
  Network:
    style: row
    columns: 2
    icon: mdi-lan
  Home:
    style: row
    columns: 3
    icon: mdi-home-assistant

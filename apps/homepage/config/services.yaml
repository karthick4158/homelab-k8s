# https://gethomepage.dev/configs/services/
# Cluster apps are reached by in-cluster Service DNS; LAN boxes by IP.
# Secrets are {{HOMEPAGE_VAR_*}} from the homepage-keys Secret.
# namespace + podSelector add a pod status dot (rbac.yaml grants pod reads).

- Media:
    - Plex:
        icon: si-plex
        href: https://plex.homelab.lan
        description: Media server
        namespace: media
        podSelector: app=plex
        widget:
          type: plex
          url: http://plex.media.svc.cluster.local:32400
          key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
    - Jellyfin:
        icon: si-jellyfin
        href: https://jellyfin.homelab.lan
        description: Media server
        namespace: media
        podSelector: app=jellyfin
        widget:
          type: jellyfin
          url: http://jellyfin.media.svc.cluster.local:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          version: 2
          enableBlocks: true
          enableNowPlaying: true
    - Seerr:
        icon: mdi-movie-search
        href: https://seerr.homelab.lan
        description: Requests
        namespace: media
        podSelector: app=downloads
        widget:
          type: seerr
          url: http://seerr.media.svc.cluster.local:5055
          key: "{{HOMEPAGE_VAR_SEERR_KEY}}"

- Downloads:
    # No key: gluetun's auth config (components/gluetun) leaves
    # GET /v1/publicip/ip open.
    - Gluetun:
        icon: mdi-vpn
        description: VPN
        namespace: media
        podSelector: app=downloads
        widget:
          type: gluetun
          url: http://gluetun.media.svc.cluster.local:8000
          version: 2
    - Radarr:
        icon: si-radarr
        href: https://radarr.homelab.lan
        description: Movies
        namespace: media
        podSelector: app=downloads
        widget:
          type: radarr
          url: http://radarr.media.svc.cluster.local:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
    - Sonarr:
        icon: si-sonarr
        href: https://sonarr.homelab.lan
        description: TV
        namespace: media
        podSelector: app=downloads
        widget:
          type: sonarr
          url: http://sonarr.media.svc.cluster.local:8989
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
    - Prowlarr:
        icon: mdi-radar
        href: https://prowlarr.homelab.lan
        description: Indexers
        namespace: media
        podSelector: app=downloads
        widget:
          type: prowlarr
          url: http://prowlarr.media.svc.cluster.local:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
    - qBittorrent:
        icon: si-qbittorrent
        href: https://qbit.homelab.lan
        description: Torrents (VPN)
        namespace: media
        podSelector: app=downloads
        widget:
          type: qbittorrent
          url: http://qbittorrent.media.svc.cluster.local:8080
          username: "{{HOMEPAGE_VAR_QBIT_USER}}"
          password: "{{HOMEPAGE_VAR_QBIT_PASS}}"
    - Transmission:
        icon: si-transmission
        href: https://transmission.homelab.lan
        description: Torrents (VPN)
        namespace: media
        podSelector: app=downloads
        widget:
          type: transmission
          url: http://transmission.media.svc.cluster.local:9091
          username: "{{HOMEPAGE_VAR_TRANSMISSION_USER}}"
          password: "{{HOMEPAGE_VAR_TRANSMISSION_PASS}}"

- Infrastructure:
    - Argo CD:
        icon: si-argo
        href: https://argocd.homelab.lan
        description: GitOps
        widget:
          type: argocd
          url: http://argocd-server.argocd.svc.cluster.local
          key: "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}"
          fields: [apps, synced, outOfSync, degraded]
    - Grafana:
        icon: si-grafana
        href: https://grafana.homelab.lan
        description: Dashboards
        namespace: monitoring
        podSelector: app.kubernetes.io/name=grafana
        widget:
          type: grafana
          url: http://monitoring-grafana.monitoring.svc.cluster.local
          username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
          password: "{{HOMEPAGE_VAR_GRAFANA_PASS}}"
    - Prometheus:
        icon: si-prometheus
        description: Metrics (no UI route)
        namespace: monitoring
        podSelector: app.kubernetes.io/name=prometheus
        widget:
          type: prometheus
          url: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
    - Dozzle:
        icon: dozzle
        href: https://dozzle.homelab.lan
        description: Live logs
        namespace: dozzle
        podSelector: app=dozzle
    - Traefik:
        icon: si-traefikproxy
        description: Gateway on 10.0.0.89 (dashboard off, API firewalled)
        namespace: traefik
        podSelector: app.kubernetes.io/name=traefik
    - Proxmox:
        icon: si-proxmox
        href: https://10.0.0.66:8006
        description: Hypervisor
        widget:
          type: proxmox
          url: https://10.0.0.66:8006
          username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"
    - OpenMediaVault:
        icon: mdi-nas
        href: http://10.0.0.65
        description: NAS
        widget:
          type: openmediavault
          url: http://10.0.0.65
          username: "{{HOMEPAGE_VAR_OMV_USER}}"
          password: "{{HOMEPAGE_VAR_OMV_PASS}}"
          method: services.getStatus

- Network:
    - Pi-hole:
        icon: si-pihole
        href: http://10.0.0.82/admin
        description: DNS
        widget:
          type: pihole
          url: http://10.0.0.82
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"
    - AdGuard Home:
        icon: si-adguard
        href: http://10.0.0.72:83
        description: DNS
        widget:
          type: adguard
          url: http://10.0.0.72:83
          username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASS}}"

- Home:
    # TODO: Home Assistant runs on VM 101; its address is not in this repo.
    # Put the URL (e.g. http://10.0.0.x:8123) in HOMEPAGE_VAR_HA_URL.
    - Home Assistant:
        icon: si-homeassistant
        href: "{{HOMEPAGE_VAR_HA_URL}}"
        description: Home automation
        widget:
          type: homeassistant
          url: "{{HOMEPAGE_VAR_HA_URL}}"
          key: "{{HOMEPAGE_VAR_HA_TOKEN}}"

# Stirling-PDF (PDF merge, split, convert, OCR) at stirling-pdf.homelab.lan. Stateless, no login.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  labels:
    app: stirling-pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stirling-pdf
  template:
    metadata:
      labels:
        app: stirling-pdf
    spec:
      containers:
        - name: stirling-pdf
          image: stirlingtools/stirling-pdf:3.3.0
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /api/v1/info/status
              port: http
            periodSeconds: 10
            failureThreshold: 30  # Java app, up to 5 min on first start
          readinessProbe:
            httpGet:
              path: /api/v1/info/status
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/info/status
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi  # 512Mi was too tight: pod sat at 510Mi and failed its startup probe
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: stirling-pdf
spec:
  selector:
    app: stirling-pdf
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stirling-pdf
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - stirling-pdf.homelab.lan
  rules:
    - backendRefs:
        - name: stirling-pdf
          port: 8080

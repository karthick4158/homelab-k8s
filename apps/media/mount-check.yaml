# Exists only to prove the share mounts: pod Running = mounted. It never reads
# any files. Delete this file after the check.
apiVersion: v1
kind: Pod
metadata:
  name: nfs-mount-check
  namespace: media
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
  containers:
    - name: check
      image: busybox:1.37.0
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: media-library
          mountPath: /media
          readOnly: true
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          memory: 16Mi
  volumes:
    - name: media-library
      persistentVolumeClaim:
        claimName: media-library
        readOnly: true

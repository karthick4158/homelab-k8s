# The OpenMediaVault media library (NFS share plex_backup on 10.0.0.65),
# mounted through csi-driver-nfs as a static PersistentVolume.
apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    gateway-access: "true"  # allows routes here to attach to traefik-gateway
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: omv-media-library
spec:
  capacity:
    storage: 1Ti  # label only; NFS does not enforce it
  accessModes:
    - ReadWriteMany
  # Retain: deleting the claim never touches the data on OMV.
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  # Pinning nfsvers=4.1 avoids the NFSv3 fallback, which needs rpc.statd.
  mountOptions:
    - nfsvers=4.1
    - hard
  csi:
    driver: nfs.csi.k8s.io
    # OMV's NFSv4 root is /export (fsid=0), so the path is /plex_backup.
    volumeHandle: "10.0.0.65#/plex_backup##"
    volumeAttributes:
      server: 10.0.0.65
      share: /plex_backup
  # OMV only allows the NFS client 10.0.0.89 (k8s-worker-1), so the mount
  # must happen there.
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker-1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: library
  namespace: media
spec:
  storageClassName: ""
  volumeName: omv-media-library
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Ti

# Profilarr, reached via traefik-gateway at profilarr.homelab.lan (http and
# https). Its container (Profilarr v2) runs in the shared VPN pod
# (downloads.yaml); this file holds its data volume, Service and route.
# profilarr-data is new for v2 (v1 data is not compatible); 1Gi because v2
# keeps git clones of the profile databases.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: profilarr-data
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  # No storageClassName: uses the default (local-path).
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: profilarr
  namespace: media
spec:
  selector:
    app: downloads  # the shared pod in downloads.yaml
  ports:
    - name: http
      port: 6868
      targetPort: profilarr  # this app's container port
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: profilarr
  namespace: media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - profilarr.homelab.lan
  rules:
    - backendRefs:
        - name: profilarr
          port: 6868

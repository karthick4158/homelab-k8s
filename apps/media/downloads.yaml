# qBittorrent, Transmission, Radarr, Sonarr and Seerr in one pod, so they all
# share the gluetun VPN sidecar (components/gluetun): one VPN connection, one
# kill switch. Each app keeps its own config volume, Service and hostname (see
# qbittorrent.yaml, transmission.yaml, radarr.yaml, sonarr.yaml, seerr.yaml);
# the Services pick their app by container port name. Inside the pod the apps
# reach each other on localhost (e.g. Radarr -> qBittorrent at localhost:8080,
# Transmission at localhost:9091).
#
# No pod-level securityContext on purpose: an fsGroup here would also apply to
# the NFS library volume and could chown K's whole library. Seerr's user is
# set on its container instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: downloads
  namespace: media
  labels:
    app: downloads
    vpn: gluetun  # gets the gluetun sidecar (components/gluetun)
spec:
  replicas: 1
  # RWO volumes: old pod must release them before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: downloads
  template:
    metadata:
      labels:
        app: downloads
    spec:
      initContainers:
        # Every start: Git owns Transmission's download folders. If
        # settings.json is missing it is seeded from the image defaults;
        # either way only download-dir, incomplete-dir and
        # incomplete-dir-enabled are rewritten, every other key (password,
        # limits, peers, web UI changes) is kept. sed edits the values in
        # place on Transmission's one-key-per-line format (the image has no
        # jq); `cat >` keeps the existing file's owner. Folders are left to
        # Transmission to create. Needs no network (kustomize puts it after
        # the gluetun sidecar, so it starts once the VPN is up).
        - name: transmission-seed
          image: lscr.io/linuxserver/transmission:4.1.4-r0-ls367
          command:
            - sh
            - -c
            - |
              set -e
              src=/config/settings.json
              [ -f "$src" ] || src=/defaults/settings.json
              sed \
                -e 's#^\([[:space:]]*"download-dir"[[:space:]]*:[[:space:]]*\)"[^"]*"#\1"/data/data/downloads/transmission/completed"#' \
                -e 's#^\([[:space:]]*"incomplete-dir"[[:space:]]*:[[:space:]]*\)"[^"]*"#\1"/data/data/downloads/transmission/incomplete"#' \
                -e 's#^\([[:space:]]*"incomplete-dir-enabled"[[:space:]]*:[[:space:]]*\)[a-z]*#\1true#' \
                "$src" > /config/settings.json.new
              cat /config/settings.json.new > /config/settings.json
              rm /config/settings.json.new
          volumeMounts:
            - name: transmission-config
              mountPath: /config
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls485
          env:
            # OMV squashes root, so writes go through the library's group:
            # PGID 100 is OMV's default "users" group (K to confirm with
            # `stat` on OMV). UMASK 002 keeps new files group-writable.
            - name: PUID
              value: "1000"
            - name: PGID
              value: "100"
            - name: UMASK
              value: "002"
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - name: qbittorrent
              containerPort: 8080
          volumeMounts:
            - name: qbittorrent-config
              mountPath: /config
            - name: library
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: qbittorrent
          # Startup: grace period while booting (up to 5 min); liveness
          # checks only begin once this passes.
          startupProbe:
            httpGet:
              path: /
              port: qbittorrent
            periodSeconds: 10
            failureThreshold: 30
          # Liveness: restart the container if the app stops answering
          # (3 misses, 30s apart = ~90s).
          livenessProbe:
            httpGet:
              path: /
              port: qbittorrent
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi

        - name: transmission
          image: lscr.io/linuxserver/transmission:4.1.4-r0-ls367
          env:
            # Same user/group as qBittorrent (see above).
            - name: PUID
              value: "1000"
            - name: PGID
              value: "100"
            - name: UMASK
              value: "002"
            # Peer port, set explicitly: qBittorrent keeps the image default
            # 6881 in the same network namespace, so they do not clash.
            - name: PEERPORT
              value: "51413"
          ports:
            - name: transmission
              containerPort: 9091
          volumeMounts:
            - name: transmission-config
              mountPath: /config
            - name: library
              mountPath: /data
          # TCP probes: an HTTP check would get 401 once USER/PASS are set.
          readinessProbe:
            tcpSocket:
              port: transmission
          startupProbe:
            tcpSocket:
              port: transmission
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: transmission
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

        - name: radarr
          image: lscr.io/linuxserver/radarr:6.4.4.10685-ls324
          env:
            # Same user/group as qBittorrent (see above).
            - name: PUID
              value: "1000"
            - name: PGID
              value: "100"
            - name: UMASK
              value: "002"
          ports:
            - name: radarr
              containerPort: 7878
          volumeMounts:
            - name: radarr-config
              mountPath: /config
            - name: library
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: radarr
          startupProbe:
            httpGet:
              path: /ping
              port: radarr
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /ping
              port: radarr
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi

        - name: sonarr
          image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls329
          env:
            # Same user/group as qBittorrent (see above).
            - name: PUID
              value: "1000"
            - name: PGID
              value: "100"
            - name: UMASK
              value: "002"
          ports:
            - name: sonarr
              containerPort: 8989
          volumeMounts:
            - name: sonarr-config
              mountPath: /config
            - name: library
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: sonarr
          startupProbe:
            httpGet:
              path: /ping
              port: sonarr
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /ping
              port: sonarr
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
        
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:2.7.0.5723-ls166
          env:
            # Same user/group as the other apps (see above).
            - name: PUID
              value: "1000"
            - name: PGID
              value: "100"
            - name: UMASK
              value: "002"
          ports:
            - name: prowlarr
              containerPort: 9696
          volumeMounts:
            - name: prowlarr-config
              mountPath: /config
          readinessProbe:
            tcpSocket:
              port: prowlarr
          startupProbe:
            httpGet:
              path: /ping
              port: prowlarr
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /ping
              port: prowlarr
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

        - name: seerr
          image: ghcr.io/seerr-team/seerr:v3.5.1
          ports:
            - name: seerr
              containerPort: 5055
          volumeMounts:
            - name: seerr-config
              mountPath: /app/config
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /api/v1/settings/public
              port: seerr
          startupProbe:
            httpGet:
              path: /api/v1/settings/public
              port: seerr
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/settings/public
              port: seerr
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi

        # Sends the pod's public IP (the VPN exit, since it shares gluetun's
        # network) to Telegram at start and whenever it changes. Script is
        # apps/media/ip-notifier.py (ConfigMap generated in kustomization.yaml).
        # Secret keys are optional so a missing telegram-notifier Secret does
        # not block the whole pod; the script then logs "Telegram credentials
        # missing".
        - name: ip-notifier
          image: python:3.13.9-slim
          command: [python, /scripts/ip-notifier.py]
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-notifier
                  key: bot-token
                  optional: true
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: telegram-notifier
                  key: chat-id
                  optional: true
            - name: CHECK_INTERVAL
              value: "300"
            # Print logs straight away instead of buffering them.
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: ip-notifier-script
              mountPath: /scripts
              readOnly: true
          # Same user as the other apps; needs no file access beyond the script.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 100
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: ip-notifier-script
          configMap:
            name: ip-notifier-script  # generated in kustomization.yaml
        - name: qbittorrent-config
          persistentVolumeClaim:
            claimName: qbittorrent-config  # qbittorrent.yaml
        - name: transmission-config
          persistentVolumeClaim:
            claimName: transmission-config # transmission.yaml
        - name: radarr-config
          persistentVolumeClaim:
            claimName: radarr-config       # radarr.yaml
        - name: sonarr-config
          persistentVolumeClaim:
            claimName: sonarr-config       # sonarr.yaml
        - name: seerr-config
          persistentVolumeClaim:
            claimName: seerr-config        # seerr.yaml
        - name: library
          persistentVolumeClaim:
            claimName: library  # media-library.yaml
        - name: prowlarr-config
          persistentVolumeClaim:
            claimName: prowlarr-config

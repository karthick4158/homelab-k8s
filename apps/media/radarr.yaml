# Radarr (movie manager), reached via traefik-gateway at radarr.homelab.lan
# (http and https). Its container runs in the shared VPN pod (downloads.yaml);
# this file holds its config volume, Service and route. Runs alongside the
# media VM 106, which is untouched; this instance starts with a fresh config.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  # No storageClassName: uses the default (local-path).
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: media
spec:
  selector:
    app: downloads  # the shared pod in downloads.yaml
  ports:
    - name: http
      port: 7878
      targetPort: radarr  # this app's container port
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  namespace: media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - radarr.homelab.lan
  rules:
    - backendRefs:
        - name: radarr
          port: 7878

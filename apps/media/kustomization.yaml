apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespaced objects only (also the generated gluetun ConfigMaps); the
# cluster-scoped PV in media-library.yaml keeps no namespace.
namespace: media

resources:
  - media-library.yaml
  - jellyfin.yaml
  - plex.yaml
  # One pod (shared VPN) for qBittorrent, Transmission, Radarr, Sonarr and
  # Seerr; the per-app files hold their volumes, Services and routes.
  - downloads.yaml
  - qbittorrent.yaml
  - transmission.yaml
  - prowlarr.yaml
  - radarr.yaml
  - sonarr.yaml
  - seerr.yaml
  - gluetun-vpn.sops.yaml
  - telegram-notifier.sops.yaml
  # Rename-and-move CronJob; its script is generated below.
  - mkv-rename.yaml

# Gluetun VPN sidecar for Deployments labelled vpn=gluetun (only downloads.yaml);
# see components/gluetun/README.md.
components:
  - ../../components/gluetun

configMapGenerator:
  - name: gluetun-app
    literals:
      # Web UIs reached through Traefik: qBittorrent 8080, Radarr 7878,
      # Sonarr 8989, Seerr 5055, Transmission 9091, Prowlarr 9696. 9999 for kubelet probes
      # on gluetun.
      - FIREWALL_INPUT_PORTS=8080,7878,8989,5055,9091,9696,9999
  # Script for the mkv-rename CronJob (mkv-rename.yaml), versioned in Git.
  - name: mkv-rename-script
    files:
      - mkv-rename.sh
  # Script for the ip-notifier container in the downloads pod (downloads.yaml).
  - name: ip-notifier-script
    files:
      - ip-notifier.py

# FileBrowser Quantum (web file manager for the media library; replaces the
# archived filebrowser/filebrowser), reached via traefik-gateway at
# media.homelab.lan (http and https). Mounts the OMV library read-write at /srv.
# Config: filebrowser-config.yaml (configMapGenerator in kustomization.yaml).
# On first start it creates user "admin" with password "admin": change it at once.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filebrowser-data
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: media
  labels:
    app: filebrowser
spec:
  replicas: 1
  # RWO volume (database): old pod must release it before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      # Same identity as jellyfin's PUID 1000 / PGID 100: OMV squashes root,
      # so writes go through the library's "users" group (100). No fsGroup:
      # it would make the kubelet chown the whole NFS library.
      securityContext:
        runAsUser: 1000
        runAsGroup: 100
        runAsNonRoot: true
      containers:
        - name: filebrowser
          # Full variant (not -slim): includes ffmpeg/mupdf for video and PDF
          # thumbnails.
          image: gtstef/filebrowser:2.0.2-stable
          # umask 002 so the config's createFilePermission 664 /
          # createDirectoryPermission 775 reach the NFS library unmasked.
          command: ["/bin/sh", "-c", "umask 002 && exec ./filebrowser"]
          env:
            - name: FILEBROWSER_CONFIG
              value: /config/config.yaml
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /database
            - name: library
              mountPath: /srv
            - name: config
              mountPath: /config
              readOnly: true
            - name: cache
              mountPath: /cache
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          # 512Mi was OOMKilled ~40 s after start while generating video
          # thumbnails of 4K HDR remuxes. 2Gi is a ceiling, not a reservation:
          # worker-1 (8 GB) is shared with Plex, Jellyfin and downloads.
          # Preview concurrency is capped by numImageProcessors in the config.
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: filebrowser-data
        - name: library
          persistentVolumeClaim:
            claimName: library  # media-library.yaml
        - name: config
          configMap:
            name: filebrowser-config
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: filebrowser
  namespace: media
spec:
  selector:
    app: filebrowser
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: filebrowser
  namespace: media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - media.homelab.lan
  rules:
    - backendRefs:
        - name: filebrowser
          port: 80

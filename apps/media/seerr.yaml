# Seerr (media request manager), reached via traefik-gateway at
# seerr.homelab.lan (http and https). Its container runs in the shared VPN pod
# (downloads.yaml); this file holds its config volume, Service and route. Runs
# alongside the Seerr VM 106, which is untouched.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seerr-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  # No storageClassName: uses the default (local-path).
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: seerr
  namespace: media
spec:
  selector:
    app: downloads  # the shared pod in downloads.yaml
  ports:
    - name: http
      port: 5055
      targetPort: seerr  # this app's container port
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr
  namespace: media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - seerr.homelab.lan
  rules:
    - backendRefs:
        - name: seerr
          port: 5055

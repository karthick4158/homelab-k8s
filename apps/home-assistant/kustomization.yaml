apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: home-assistant

resources:
  - namespace.yaml
  - home-assistant.yaml
  - servicemonitor.yaml
  - ha-prometheus-token.sops.yaml

configMapGenerator:
  # Hand-edited HA config, versioned in Git; a change rolls the pod (hash suffix).
  # UI-written files (automations/scripts/scenes/groups.yaml, .storage) and secrets.yaml
  # stay on the home-assistant-config PVC.
  - name: ha-config
    files:
      - config/configuration.yaml
      - config/dashboards/kiosk.yaml
      - config/packages/wall_panel.yaml
      - config/packages/sports.yaml

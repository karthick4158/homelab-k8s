# Packages: Git-managed files mounted read-only into /config/packages (packages/wall_panel.yaml
# holds the wall dashboard's status helpers).
homeassistant:
  packages: !include_dir_named packages

# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

# Prometheus exporter at /api/prometheus (needs a long-lived access token as Bearer).
# Scraped by kube-prometheus-stack via apps/home-assistant/servicemonitor.yaml and drawn by
# the Grafana "Home" dashboard (infrastructure/monitoring/dashboards/home.json).
# Only the curated entities below are exported, all taken from the wall dashboard.
prometheus:
  filter:
    include_entities:
      # Climate and temperatures
      - climate.living_room
      - climate.loft
      - sensor.bedroom_temperature
      - weather.home
      # Air purifier and printer
      - sensor.bedroom_core_200s_filter_lifetime
      - sensor.canon_tr4700_series
      - sensor.canon_tr4700_series_black
      - sensor.canon_tr4700_series_color
      # Washer and dryer
      - sensor.washer_machine_state
      - sensor.washer_completion_time
      - sensor.living_room_washer_progress
      - sensor.dryer_machine_state
      - sensor.dryer_completion_time
      - sensor.living_room_dryer_progress
      # Garage, car, attention banner
      - cover.garage_2
      - binary_sensor.wall_garage_open_too_long
      - lock.jn8bt3dd1tw486371_lock
      - binary_sensor.jn8bt3dd1tw486371_hatch
      - binary_sensor.wall_attention
      # ESPHome sprinkler zones
      - switch.sprinkler_controller_01_sprinkler_01
      - switch.sprinkler_controller_01_sprinkler_02
      - switch.sprinkler_controller_01_sprinkler_03
      - switch.sprinkler_controller_01_sprinkler_04
      - switch.sprinkler_5
      - switch.sprinkler_6
      - switch.sprinkler_7
      - switch.sprinkler_8
      - switch.sprinkler_controller_3_sprinkler_1
      - switch.sprinkler_controller_3_sprinkler_2
      - switch.sprinkler_controller_3_sprinkler_3
      - switch.sprinkler_controller_3_sprinkler_4
      # Main switches
      - switch.z_main_switch_c1
      - switch.z_c2_main_switch
      # Plugs (wall dashboard "Plugs" section)
      - switch.coat_room
      - switch.laundry
      - switch.mb_closet
      - switch.office_closet
      - switch.pantry
      - switch.rice_cooker
      - switch.tv
      - switch.projector
      - switch.iphone_charger
      - switch.vaccum_charger
      # Lights (wall dashboard "All lights off")
      - light.backyard
      - light.garage_door
      - light.strip_light
      - light.stovetop_light
      - light.office_zig1_level_on_off
      - light.h6199_4d1f
      - light.powderroom_1
      - light.smart_bulb_2
      - light.guestbath1
      - light.guestbath2
      - light.guestbath3
      - light.mb1
      - light.mb2
      - light.mb3
      - light.mb4

frontend:
  themes: !include_dir_merge_named themes

# Wall dashboard for the Fire tablet (Fully Kiosk). Git-managed file, mounted read-only.
lovelace:
  dashboards:
    wall-kiosk:
      mode: yaml
      title: Wall
      icon: mdi:tablet-dashboard
      show_in_sidebar: true
      require_admin: false
      filename: dashboards/kiosk.yaml


# Example configuration.yaml entry
timer:
  sprinklertimer:
    duration: "00:00:00"

input_number:
  example_number:
    name: Watering Time
    initial: 59
    min: 1
    max: 120
    step: 1
    unit_of_measurement: minutes

input_boolean:
  enable_alternate_day_sprinkler:
    name: Enable Alternate Day Sprinkler
    initial: off
    icon: mdi:sprinkler


group: !include groups.yaml
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Example configuration.yaml entry configuring HomeKit
homekit:
  - name: Home Assistant Bridge
    port: 21063
    filter:
      include_domains:
        - alarm_control_panel
        - light
        - media_player
      include_entity_globs:
        - binary_sensor.*_occupancy
      include_entities:
        - binary_sensor.living_room_motion
        - cover.office_blind_window_covering
        - light.garage_door
        - light.backyard
        - light.strip_light
        - light.garage_1
        - light.stovetop_light
        - light.guestbathnightlight
        - switch.rice_cooker
        - switch.coat_room_led
        - switch.laundry
        - switch.mb_closet
        - switch.office_closet
        - switch.pantry
        - switch.shelly1_e8db84acc31f
        - switch.shelly1_e8db84ac7d25
        - switch.front_porch
        - switch.tv
        - switch.work_plug
        - switch.tp_link_smart_plug_59e6_workstation
        - switch.tp_link_smart_plug_59e6_homeserver
        - sensor.lumi_lumi_remote_b1acn01_power
        - sensor.office_blind_power
        - input_select.homekit_presence_detection
        - input_boolean.enable_alternate_day_sprinkler
        - media_player.home_theater
        - switch.z_main_switch_c1
        - switch.z_c2_main_switch
        - button.jn8bt3dd1tw486371_remote_start
        - button.jn8bt3dd1tw486371_remote_stop
        - button.jn8bt3dd1tw486371_remote_unlock
        - lock.jn8bt3dd1tw486371_lock
        - fan.bedroom_core_200s

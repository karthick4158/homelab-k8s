# Wall dashboard for the 10" Fire tablet (Fully Kiosk, landscape ~1280x800). Served at /wall-kiosk.
# Git-managed and mounted read-only: edit here, not in the HA UI. Built-in cards only.
# Layout rules: every view fits one screen with no scrolling; max_columns 3 (4 clips at 1280 px;
# Lights still uses 4 and is due the same treatment);
# sections in a view are about the same height; every section holds an even number of tiles in
# 2 equal columns, all the same height, each with an explicit mdi icon.
title: Wall
views:
  # ---------------------------------------------------------------- Home
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 3
    sections:
      # Left: clock, weather, who's home.
      - type: grid
        cards:
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: >-
              <h1><ha-icon icon="mdi:clock-outline"></ha-icon>
              {{ now().strftime('%-I:%M %p') }}</h1>
              {{ now().strftime('%A, %B %-d') }}
          - type: weather-forecast
            entity: weather.home
            forecast_type: daily
            forecast_slots: 5
            show_current: true
            show_forecast: true
            grid_options:
              columns: full
          - type: tile
            entity: person.karthick
            name: Karthick
            icon: mdi:account
          - type: tile
            entity: sensor.fire_tablet_battery
            name: Tablet
            icon: mdi:tablet

      # Middle: cameras.
      - type: grid
        cards:
          - type: picture-entity
            entity: camera.10_0_0_72
            name: Driveway
            camera_view: live
            show_state: false
            grid_options:
              columns: full
          - type: picture-entity
            entity: camera.radar_wu_ohio_current
            name: Radar
            camera_view: auto
            show_state: false
            grid_options:
              columns: full

      # Right: doors, then the car. Door sensors use a fixed icon (the state icon
      # rendered blank on the tablet); the tile still shows Open/Closed and colours when open.
      - type: grid
        cards:
          - type: heading
            heading: Doors
            icon: mdi:door
          - type: tile
            entity: cover.garage_2
            name: Garage door
            icon: mdi:garage
            tap_action: &garage_toggle
              action: toggle
              confirmation:
                text: Open/close the garage?
            icon_tap_action: *garage_toggle
            hold_action:
              action: none
          - type: tile
            entity: binary_sensor.lumi_lumi_sensor_magnet_aq2_8c1ad107_on_off
            name: Garage entry
            icon: mdi:door
          - type: tile
            entity: binary_sensor.lumi_lumi_sensor_magnet_aq2_on_off
            name: Coat room
            icon: mdi:door
          - type: tile
            entity: binary_sensor.lumi_lumi_sensor_magnet_aq2_7c2abf07_on_off
            name: Laundry
            icon: mdi:door
          - type: tile
            entity: binary_sensor.lumi_lumi_sensor_magnet_aq2_372abf07_on_off
            name: Pantry
            icon: mdi:door
          - type: tile
            entity: binary_sensor.lumi_lumi_sensor_magnet_aq2_14481007_on_off
            name: Office closet
            icon: mdi:door
          # Nissan Rogue: no battery/range sensors exist; lock + hatch only.
          - type: heading
            heading: Car
            icon: mdi:car
          - type: tile
            entity: lock.jn8bt3dd1tw486371_lock
            name: Car lock
            icon: mdi:car-key
            tap_action: &car_toggle
              action: toggle
              confirmation:
                text: Lock/unlock the car?
            icon_tap_action: *car_toggle
            hold_action:
              action: none
          - type: tile
            entity: binary_sensor.jn8bt3dd1tw486371_hatch
            name: Car hatch
            icon: mdi:car-back

  # ---------------------------------------------------------------- Climate
  # Two sections, both 4 tile-rows tall: thermostats (2-row tiles) and laundry.
  - title: Climate
    path: climate
    icon: mdi:thermostat
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Climate
            icon: mdi:thermostat
          - type: tile
            entity: climate.living_room
            name: Living Room
            icon: mdi:thermostat
            features: &climate_features
              - type: target-temperature
          - type: tile
            entity: climate.loft
            name: Loft
            icon: mdi:thermostat
            features: *climate_features
          - type: tile
            entity: sensor.bedroom_temperature
            name: Bedroom
            icon: mdi:thermometer
            grid_options:
              rows: 2
          - type: tile
            entity: weather.home
            name: Outside
            icon: mdi:sun-thermometer
            state_content: [temperature, state]
            grid_options:
              rows: 2

      - type: grid
        cards:
          - type: heading
            heading: Laundry
            icon: mdi:washing-machine
          - type: tile
            entity: sensor.washer_machine_state
            name: Washer
            icon: mdi:washing-machine
          - type: tile
            entity: sensor.dryer_machine_state
            name: Dryer
            icon: mdi:tumble-dryer
          - type: tile
            entity: sensor.washer_job_state
            name: Washer job
            icon: mdi:timer-outline
          - type: tile
            entity: sensor.dryer_job_state
            name: Dryer job
            icon: mdi:timer-outline
          - type: tile
            entity: sensor.living_room_washer_progress
            name: Washer progress
            icon: mdi:progress-clock
          - type: tile
            entity: sensor.living_room_dryer_progress
            name: Dryer progress
            icon: mdi:progress-clock
          - type: tile
            entity: sensor.washer_completion_time
            name: Washer done
            icon: mdi:clock-check-outline
          - type: tile
            entity: sensor.dryer_completion_time
            name: Dryer done
            icon: mdi:clock-check-outline

  # ---------------------------------------------------------------- Lights
  - title: Lights
    path: lights
    icon: mdi:lightbulb-group
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Kitchen & outside
            icon: mdi:lightbulb
          - type: tile
            entity: light.backyard
            name: Backyard
          - type: tile
            entity: light.garage_door
            name: Garage door
          - type: tile
            entity: light.strip_light
            name: Cabinet strip
          - type: tile
            entity: light.stovetop_light
            name: Stove top
          - type: tile
            entity: light.office_zig1_level_on_off
            name: Office
          - type: tile
            entity: light.h6199_4d1f
            name: TV backlight
          - type: tile
            entity: light.powderroom_1
            name: Powder room
          - type: tile
            entity: light.smart_bulb_2
            name: Smart bulb 2

      - type: grid
        cards:
          - type: heading
            heading: Baths & bedroom
            icon: mdi:bed
          - type: tile
            entity: light.guestbath1
            name: Guest bath 1
          - type: tile
            entity: light.guestbath2
            name: Guest bath 2
          - type: tile
            entity: light.guestbath3
            name: Guest bath 3
          - type: tile
            entity: light.mb1
            name: MB 1
          - type: tile
            entity: light.mb2
            name: MB 2
          - type: tile
            entity: light.mb3
            name: MB 3
          - type: tile
            entity: light.mb4
            name: MB 4

      - type: grid
        cards:
          - type: heading
            heading: Scenes
            icon: mdi:palette
          - type: button
            name: All lights off
            icon: mdi:lightbulb-group-off
            show_state: false
            grid_options:
              columns: full
              rows: 1
            tap_action:
              action: perform-action
              perform_action: light.turn_off
              target:
                entity_id:
                  - light.backyard
                  - light.garage_door
                  - light.strip_light
                  - light.stovetop_light
                  - light.office_zig1_level_on_off
                  - light.h6199_4d1f
                  - light.powderroom_1
                  - light.smart_bulb_2
                  - light.guestbath1
                  - light.guestbath2
                  - light.guestbath3
                  - light.mb1
                  - light.mb2
                  - light.mb3
                  - light.mb4
          - type: tile
            entity: scene.kitchen_cabinet_light
            name: Cabinet
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: scene.turn_on
              target:
                entity_id: scene.kitchen_cabinet_light
          - type: tile
            entity: scene.stove_lights_switch_on
            name: Stove lights
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: scene.turn_on
              target:
                entity_id: scene.stove_lights_switch_on
          - type: tile
            entity: scene.stove_light_red
            name: Stove red
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: scene.turn_on
              target:
                entity_id: scene.stove_light_red

      - type: grid
        cards:
          - type: heading
            heading: Plugs
            icon: mdi:power-socket-us
          - type: tile
            entity: switch.coat_room
            name: Coat room
          - type: tile
            entity: switch.laundry
            name: Laundry
          - type: tile
            entity: switch.mb_closet
            name: MB closet
          - type: tile
            entity: switch.office_closet
            name: Office closet
          - type: tile
            entity: switch.pantry
            name: Pantry
          - type: tile
            entity: switch.rice_cooker
            name: Rice cooker
          - type: tile
            entity: switch.tv
            name: TV plug
          - type: tile
            entity: switch.projector
            name: Projector
          - type: tile
            entity: switch.iphone_charger
            name: iPhone charger
          - type: tile
            entity: switch.vaccum_charger
            name: Vacuum charger

  # ---------------------------------------------------------------- Water
  # Every zone asks before toggling (body and icon taps share one anchor).
  - title: Water
    path: water
    icon: mdi:sprinkler-variant
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Controller 1 & 2
            icon: mdi:sprinkler-variant
          - type: tile
            entity: switch.sprinkler_controller_01_sprinkler_01
            name: Zone 01
            tap_action: &zone_toggle
              action: toggle
              confirmation:
                text: Turn this sprinkler zone on/off?
            icon_tap_action: *zone_toggle
          - type: tile
            entity: switch.sprinkler_controller_01_sprinkler_02
            name: Zone 02
            tap_action: *zone_toggle
            icon_tap_action: *zone_toggle
          - type: tile
            entity: switch.sprinkler_controller_01_sprinkler_03
            name: Zone 03
            tap_action: *zone_toggle
            icon_tap_action: *zone_toggle
          - type: tile
            entity: switch.sprinkler_controller_01_sprinkler_04
            name: Zone 04
            tap_action: *zone_toggle
            icon_tap_action: *zone_toggle
          - type: tile
            entity: switch.sprinkler_5
            name: Zone 5
            tap_action: *zone_toggle
            icon_tap_action: *zone_toggle
          - type: tile
            entity: switch.sprinkler_6
            name: Zone 6
            tap_action: *zone_toggle
            icon_tap_action: *zone_toggle
          - type: tile
            entity: switch.sprinkler_7
            name: Zone 7
            tap_action: *zone_toggle
            icon_tap_action: *zone_toggle
          - type: tile
            entity: switch.sprinkler_8
            name: Zone 8
            tap_action: *zone_toggle
            icon_tap_action: *zone_toggle

      - type: grid
        cards:
          - type: heading
            heading: Controller 3
            icon: mdi:sprinkler-variant
          - type: tile
            entity: switch.sprinkler_controller_3_sprinkler_1
            name: C3 Zone 1
            tap_action: *zone_toggle
            icon_tap_action: *zone_toggle
          - type: tile
            entity: switch.sprinkler_controller_3_sprinkler_2
            name: C3 Zone 2
            tap_action: *zone_toggle
            icon_tap_action: *zone_toggle
          - type: tile
            entity: switch.sprinkler_controller_3_sprinkler_3
            name: C3 Zone 3
            tap_action: *zone_toggle
            icon_tap_action: *zone_toggle
          - type: tile
            entity: switch.sprinkler_controller_3_sprinkler_4
            name: C3 Zone 4
            tap_action: *zone_toggle
            icon_tap_action: *zone_toggle

  # ---------------------------------------------------------------- Media
  - title: Media
    path: media
    icon: mdi:television-play
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Media
            icon: mdi:television-play
          - type: tile
            entity: media_player.living_room_apple_tv
            name: Living room Apple TV
            grid_options:
              columns: full
          - type: tile
            entity: media_player.loft
            name: Loft Apple TV
            grid_options:
              columns: full
          - type: tile
            entity: media_player.tv
            name: Samsung TV
            grid_options:
              columns: full
          - type: tile
            entity: media_player.home_theater
            name: Denon
            grid_options:
              columns: full

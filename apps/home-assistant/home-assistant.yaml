# Home Assistant at ha.homelab.lan. Staged at 0 replicas; the instance on VM 101 stays live
# until cutover (see docs/cluster-setup.md). Host network on k8s-worker-1 for LAN discovery
# (mDNS/SSDP); ConBee Zigbee stick passed through to VM 202 at /dev/ttyACM0.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  labels:
    app: home-assistant
spec:
  # Argo CD self-heal reverts `kubectl scale`, so cutover = change this to 1 in Git.
  replicas: 1
  strategy:
    type: Recreate  # RWO volume, host port 8123
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-1  # USB stick is on VM 202
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.11.1
          ports:
            - name: http
              containerPort: 8123
          env:
            - name: TZ
              value: America/Chicago
          securityContext:
            privileged: true  # USB Zigbee stick access
          startupProbe:
            tcpSocket:
              port: 8123
            periodSeconds: 10
            failureThreshold: 30  # up to 5 min on first start
          readinessProbe:
            tcpSocket:
              port: 8123
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8123
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            # Git-managed file shadows the PVC copy; read-only in HA's file editor.
            - name: ha-config
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
            - name: ha-config
              mountPath: /config/dashboards/kiosk.yaml
              subPath: kiosk.yaml
              readOnly: true
            - name: ha-config
              mountPath: /config/packages/wall_panel.yaml
              subPath: wall_panel.yaml
              readOnly: true
            - name: ha-config
              mountPath: /config/packages/sports.yaml
              subPath: sports.yaml
              readOnly: true
            - name: zigbee
              mountPath: /dev/ttyACM0
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: ha-config
          configMap:
            name: ha-config
        - name: zigbee
          hostPath:
            path: /dev/ttyACM0
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  labels:
    app: home-assistant  # selected by the ServiceMonitor (servicemonitor.yaml)
spec:
  selector:
    app: home-assistant
  ports:
    - name: http
      port: 8123
      targetPort: 8123
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - ha.homelab.lan
  rules:
    - backendRefs:
        - name: home-assistant
          port: 8123

# Dozzle log viewer at dozzle.homelab.lan (apps/dozzle).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dozzle
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:karthick4158/homelab-k8s.git
    targetRevision: main
    path: apps/dozzle
  destination:
    server: https://kubernetes.default.svc
    namespace: dozzle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

# Traefik v3.7.16 (chart 42.1.3) on k8s-worker-1, listening on the node's own
# IP (10.0.0.89) ports 80/443 via hostNetwork. No LoadBalancer/MetalLB yet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.1.3
    helm:
      skipCrds: true  # CRDs come from traefik-crds and gateway-api-crds
      valuesObject:
        deployment:
          replicas: 1
        nodeSelector:
          kubernetes.io/hostname: k8s-worker-1
        hostNetwork: true
        # Old pod must stop before the new one can bind 80/443.
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
            maxSurge: 0
        ports:
          web:
            port: 80
          websecure:
            port: 443
        # Binding ports below 1024 needs NET_BIND_SERVICE.
        securityContext:
          capabilities:
            drop: [ALL]
            add: [NET_BIND_SERVICE]
          readOnlyRootFilesystem: true
        podSecurityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
        service:
          enabled: false
        providers:
          kubernetesCRD:
            enabled: true
          kubernetesIngress:
            enabled: true
          kubernetesGateway:
            enabled: true
        gateway:
          enabled: true
        ingressRoute:
          dashboard:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

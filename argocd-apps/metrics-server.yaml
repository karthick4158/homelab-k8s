# metrics-server (chart from kubernetes-sigs.github.io). Feeds `kubectl top`
# and HorizontalPodAutoscalers with CPU/memory usage from the kubelets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.14.0
    helm:
      valuesObject:
        args:
          # kubeadm kubelets use self-signed serving certs; acceptable on this
          # LAN-only cluster. Proper fix later: serverTLSBootstrap.
          - --kubelet-insecure-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

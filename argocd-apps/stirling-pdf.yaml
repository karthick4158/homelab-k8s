# Stirling-PDF (PDF tools) at stirling-pdf.homelab.lan (apps/stirling-pdf).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stirling-pdf
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:karthick4158/homelab-k8s.git
    targetRevision: main
    path: apps/stirling-pdf
  destination:
    server: https://kubernetes.default.svc
    namespace: tools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

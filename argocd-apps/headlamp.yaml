# Headlamp (chart 0.46.0): Kubernetes web UI at headlamp.homelab.lan. Users
# log in with a ServiceAccount token; the headlamp-admin account (read-only)
# plus the namespace label and the route come from headlamp-extras.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: 0.46.0
    helm:
      valuesObject:
        # The chart binds its own ServiceAccount to cluster-admin by default.
        # Headlamp acts with the token each user logs in with, so the pod
        # needs no cluster rights.
        clusterRoleBinding:
          create: false
        service:
          type: ClusterIP
          port: 80
        ingress:
          enabled: false  # routed by infrastructure/headlamp/httproute.yaml
        httpRoute:
          enabled: false
        nodeSelector:
          kubernetes.io/hostname: k8s-worker-1
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # headlamp-extras labels the namespace; whichever app syncs first, the
    # other may have to retry.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

# Omni Tools (file, text and image utilities) at omni-tools.homelab.lan (apps/omni-tools).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: omni-tools
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:karthick4158/homelab-k8s.git
    targetRevision: main
    path: apps/omni-tools
  destination:
    server: https://kubernetes.default.svc
    namespace: omni-tools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

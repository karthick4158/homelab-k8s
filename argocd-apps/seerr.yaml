# Seerr media request manager, reached at seerr.homelab.lan.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seerr
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io  # cascade-delete resources when this app is removed
spec:
  project: default
  source:
    repoURL: git@github.com:karthick4158/homelab-k8s.git
    targetRevision: main
    path: apps/seerr
  destination:
    server: https://kubernetes.default.svc
    namespace: seerr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
